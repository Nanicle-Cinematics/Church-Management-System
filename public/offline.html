<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline · Church Manager</title>
<meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)">
<!-- Shown by public/sw.js when a page cannot load because the device is
     offline. Self-contained: it is served from the service worker's cache. -->
<style>
  :root { --bg: #f6f6f8; --panel: #fff; --text: #16161d; --text-2: #5b5b6b; --line: #e3e3ea; --accent: #5b4cff; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0f; --panel: #131318; --text: #f2f2f6; --text-2: #a3a3b2; --line: #26262f; --accent: #7466ff; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: min(420px, 100%); padding: 32px 26px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { margin: 16px 0 6px; font-size: 22px; font-weight: 650; }
  p { margin: 0 0 22px; color: var(--text-2); }
  button { min-height: 44px; padding: 0 22px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: 600 15px system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/static/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Church Manager needs an internet connection to load your church's records. Check your Wi-Fi or mobile data, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
