name: deploy

# Deploys only after the "tests" workflow has PASSED on main. It used to run on
# every push to main in parallel with the tests, so a red build still shipped.
#
# This repo is public and this job holds the production deploy token, so it
# must only ever deploy code pushed to THIS repository. `branches: [main]` is
# matched against the branch NAME, which a pull request from a fork can also
# call "main"; without the checks below, such a PR with passing tests would
# make this job build the fork's code with FLY_API_TOKEN.
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  fly:
    name: Deploy to Fly.io
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Pinned to a release tag instead of @master, which would run whatever
      # that branch contains next while holding the production deploy token.
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Health check
        env:
          BASE_URL: https://church-management-system.fly.dev
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "${BASE_URL}/healthz" >/dev/null; then
              echo "healthz: OK"; break
            fi
            echo "healthz attempt ${i} failed, retrying..."; sleep 5
          done
          curl -fsS --max-time 10 "${BASE_URL}/readyz" >/dev/null && echo "readyz: OK"

      - name: Verify public auth surfaces
        env:
          BASE_URL: https://church-management-system.fly.dev
        run: |
          curl -fsS --max-time 10 "${BASE_URL}/" >/dev/null
          curl -fsS --max-time 10 "${BASE_URL}/login" >/dev/null
          curl -fsS --max-time 10 "${BASE_URL}/signup" >/dev/null
