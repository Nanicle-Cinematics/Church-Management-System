name: tests

# A push to any branch used to run this AND the pull-request run, testing the
# same code twice (about half of all CI minutes). Now a branch is tested when it
# has a pull request, and main is tested after every merge (the deploy waits for
# that run). To test a branch without a pull request, use Actions > Run workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: church
          POSTGRES_PASSWORD: church_test
          POSTGRES_DB: church_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U church -d church_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://church:church_test@localhost:5432/church_test
      SESSION_SECRET: ci-session-secret-not-for-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx prisma db push
      - run: node scripts/ensure-session-table.js
      - run: npm run check:raw-sql-tenant-scoping
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
