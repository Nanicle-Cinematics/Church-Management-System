name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: church
          POSTGRES_PASSWORD: church_test
          POSTGRES_DB: church_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U church -d church_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://church:church_test@localhost:5432/church_test
      SESSION_SECRET: ci-session-secret-not-for-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx prisma db push
      - run: node scripts/ensure-session-table.js
      - run: npm run check:raw-sql-tenant-scoping
      # The app runs in production as a data-only role, never the owner. Create
      # the same role here (the owner, above, made the schema) and run the whole
      # suite as it, so anything that needs to create, alter or drop a table
      # at runtime fails here instead of in production.
      - name: Create the data-only role the app runs as
        run: |
          psql "postgresql://church:church_test@localhost:5432/church_test" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE church_app WITH LOGIN PASSWORD 'church_app_test';
          GRANT CONNECT ON DATABASE church_test TO church_app;
          GRANT USAGE ON SCHEMA public TO church_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO church_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO church_app;
          SQL
      - name: Run the tests as the data-only role
        run: npm test
        env:
          DATABASE_URL: postgresql://church_app:church_app_test@localhost:5432/church_test
      - run: npm audit --omit=dev --audit-level=high
